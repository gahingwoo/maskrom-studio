# nfpm config for the .deb and .rpm, as in RKDevelopTool-GUI.
#   VERSION=0.1.0 PKG_ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
# PKG_ARCH is amd64 or arm64. dist/app is electron-builder's unpacked app
# (dist/linux-unpacked or dist/linux-arm64-unpacked), copied there.
name: maskrom-studio
arch: ${PKG_ARCH}
platform: linux
version: ${VERSION}
maintainer: Ga Hing Woo <gahing@gahingwoo.com>
description: |
  Install and restore systems and UEFI firmware on Rockchip boards over
  USB in Maskrom mode: Windows 11 23H2 on RK3576 boards without a USB
  stick, edk2-rk3576 firmware writes and upgrades, Armbian or a factory
  image. Downloads are checked against their published SHA-256.
# Earlier versions were packaged as woa-rk3576-imager: this one takes its place.
replaces:
  - woa-rk3576-imager
conflicts:
  - woa-rk3576-imager
homepage: https://github.com/gahingwoo/maskrom-studio
license: GPL-2.0-only
section: utils
priority: optional

# What Electron needs from the system: electron-builder's list, without
# libXss (Electron no longer links or loads it), with libgbm and ALSA,
# which the maskrom-studio binary links and the list leaves out. On Ubuntu
# 24.04 and later libasound2t64 is the package, and the t64 packages
# provide the old names (libgtk-3-0, libatspi2.0-0).
depends:
  - libgtk-3-0 | gtk3
  - libnotify4 | libnotify
  - libnss3 | nss
  - libxtst6 | libXtst
  - libgbm1
  - libasound2t64 | libasound2
  - xdg-utils
  - libatspi2.0-0 | at-spi2-core
  - libuuid1 | libuuid
  - libsecret-1-0 | libsecret
  - pkexec | polkit
overrides:
  rpm:
    depends:
      - gtk3
      - libnotify
      - nss
      - libXtst
      - mesa-libgbm
      - alsa-lib
      - xdg-utils
      - at-spi2-core
      - libuuid
      - libsecret
      - polkit

contents:
  - src: ./dist/app/
    dst: /opt/maskrom-studio/
    type: tree
  - src: ./packaging/launcher.sh
    dst: /usr/bin/maskrom-studio
    file_info:
      mode: 0755
  - src: ./packaging/com.gahingwoo.MaskromStudio.desktop
    dst: /usr/share/applications/com.gahingwoo.MaskromStudio.desktop
  - src: ./packaging/com.gahingwoo.MaskromStudio.metainfo.xml
    dst: /usr/share/metainfo/com.gahingwoo.MaskromStudio.metainfo.xml
  - src: ./build-res/hicolor/
    dst: /usr/share/icons/hicolor/
    type: tree
  # USB access for the desktop user, so Maskrom writing needs no sudo.
  - src: ./packaging/70-maskrom-studio.rules
    dst: /usr/lib/udev/rules.d/70-maskrom-studio.rules
  - src: ./packaging/udev-reload.sh
    dst: /usr/share/maskrom-studio/udev-reload.sh
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/doc/maskrom-studio/LICENSE

scripts:
  postinstall: ./packaging/postinstall.sh
  postremove: ./packaging/udev-reload.sh
