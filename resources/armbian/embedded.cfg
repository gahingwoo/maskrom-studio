# Built into grubaa64.efi (scripts/build-grub.sh). WoA RK3576 Imager puts
# this GRUB on the EFI partition as \EFI\armbian\grubaa64.efi, with a
# grub.cfg beside it that names the Armbian root file system. Nothing here
# depends on one install, so the same binary serves every board.
#
# 1. grub.cfg next to this file (written by the imager).
# 2. Without it: the first file system with the imager's menu on it.
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
if [ -f "${cmdpath}/grub.cfg" ]; then
  configfile "${cmdpath}/grub.cfg"
fi
if search --no-floppy --set=root --file /boot/grub/armbian-uefi.cfg; then
  configfile /boot/grub/armbian-uefi.cfg
fi
echo "No grub.cfg next to grubaa64.efi (${cmdpath}) and no /boot/grub/armbian-uefi.cfg on any disk."
echo "Returning to the firmware in 30 seconds."
sleep 30
exit
