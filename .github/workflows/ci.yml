name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: rkdeveloptool WASM
    uses: ./.github/workflows/wasm.yml

  test:
    name: Tests, Maskrom in Electron, screenshots
    needs: wasm
    runs-on: ubuntu-24.04
    # A test that never ends must not hold a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      # For the tests that check the staged layout with the real tools:
      # mkfs.vfat and mtools (FAT32), fsck.exfat, sfdisk and sgdisk.
      # fonts-noto-cjk: the runner has no Chinese font, so the zh-CN
      # screenshots came out as boxes.
      - name: File system tools and a Chinese font
        # A mirror that hangs fails the step in minutes, and is tried again, instead of holding the job.
        # Without these tools the file system tests skip themselves and the zh-CN screenshots
        # lack a CJK font; the rest of the job still runs.
        timeout-minutes: 12
        continue-on-error: true
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            sudo apt-get $APT update -qq && sudo apt-get $APT install -y -qq dosfstools mtools exfatprogs gdisk fdisk fonts-noto-cjk && exit 0
            echo "apt failed (try $i); again in 20 s"; sleep 20
          done
          exit 1
      - name: Shell scripts
        run: shellcheck -S warning install.sh packaging/*.sh scripts/*.sh
      - run: npm run typecheck
      - name: Unit tests (staged layout, file systems, Maskrom through the WASM against a pretend board)
        run: npm test
      # The stores the UEFI settings writer makes (uefi-vars.test.ts), read back by a checker written from
      # EDK2's VariableFormat.h and one compiled against EDK2's own headers (scripts/varstore).
      - name: UEFI variable stores, cross-checked against EDK2
        run: |
          set -eu
          git clone -q --depth 1 --filter=blob:none --sparse -b edk2-stable202602 https://github.com/tianocore/edk2 /tmp/edk2
          git -C /tmp/edk2 sparse-checkout set MdePkg/Include MdeModulePkg/Include
          VARSTORE_OUT=/tmp/varstores npx vitest run test/uefi-vars.test.ts
          sh scripts/varstore/check-all.sh /tmp/edk2 /tmp/varstores
      - name: Maskrom loader built from rkbin matches its pin
        run: node scripts/check-loader.mjs
      - name: Tests of the modules copied from edk2-webflash (xz, image source)
        run: node --test test/webflash/*.test.js
      - run: npm run build
      - name: Maskrom path inside Electron against a pretend board
        run: xvfb-run -a node scripts/electron-maskrom-e2e.mjs
      - name: Staged Windows install inside Electron against a pretend TaishanPi 3M
        run: xvfb-run -a node scripts/electron-woa-e2e.mjs
      - name: ROCK 4D firmware to the SPI NOR, keeping the UEFI settings, inside Electron against a pretend ROCK 4D
        run: xvfb-run -a node scripts/electron-rock4d-e2e.mjs
      - name: ROCK 4D Armbian next to Windows (NVMe and SD card), the firmware checked first, inside Electron
        run: xvfb-run -a node scripts/electron-rock4d-hybrid-e2e.mjs
      - name: A board that goes away, Try again and Report a problem inside Electron
        run: xvfb-run -a node scripts/electron-retry-e2e.mjs
      - name: The RK3576 driver package in the Windows setup step inside Electron
        run: xvfb-run -a node scripts/electron-drivers-e2e.mjs
      - name: Scrolling and text selection inside Electron at small window sizes
        run: xvfb-run -a node scripts/electron-scroll-e2e.mjs
      - name: Language, keyboard and time zone pickers of the setup step inside Electron
        run: xvfb-run -a node scripts/electron-setup-pickers-e2e.mjs
      - name: Screenshots
        run: xvfb-run -a node scripts/shots.mjs shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

  sd-e2e-mac:
    name: SD write through authopen to a RAM disk on macOS
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Built as in release.yml, so this is the helper the DMG ships.
      - name: Raw disk helper (C, opens the disk through authopen)
        run: npm run writer
      - run: file build-res/writer/maskrom-studio-rawdisk
      - run: command -v xz || brew install xz
      - name: Write, read back, refuse the system disk, cancel
        run: node test/e2e/sd-ramdisk-mac.mjs
      - name: In-app update, swap the app for the one in a DMG (real hdiutil, ditto, xattr)
        run: node test/e2e/update-dmg-mac.mjs
      # The three casks of gahingwoo/homebrew-tap as scripts/bump-cask.mjs
      # writes them (made-up checksums for the tagged two), in a local tap,
      # through brew's own style check and an offline audit.
      - name: Homebrew casks pass brew style and audit
        run: |
          set -eux
          mkdir -p /tmp/casks
          node scripts/bump-cask.mjs ci /tmp/casks
          node --input-type=module -e "
            import { taggedCask } from './scripts/bump-cask.mjs';
            import { writeFileSync } from 'node:fs';
            for (const tag of ['v0.2.0', 'v0.2.0-beta.1']) {
              const c = taggedCask(tag, { arm: 'a'.repeat(64), intel: 'b'.repeat(64) });
              writeFileSync('/tmp/casks/' + c.name + '.rb', c.text);
            }"
          brew tap-new --no-git local/check
          mkdir -p "$(brew --repository local/check)/Casks"
          cp /tmp/casks/*.rb "$(brew --repository local/check)/Casks/"
          brew style local/check
          brew trust local/check || true
          for c in maskrom-studio maskrom-studio@beta maskrom-studio@nightly; do brew audit --cask --strict "local/check/$c"; done

  sd-e2e:
    name: SD write to a loop device
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Writer (Node.js packed with pkg, as Etcher's etcher-util)
        run: npm run writer
      - uses: actions/download-artifact@v4
        with:
          name: rkdeveloptool-wasm
          path: vendor/rkdeveloptool-wasm
      - run: npm run build
      - name: Write, read back, refuse the system disk
        run: node test/e2e/sd-loop.mjs

  browser-gpu:
    name: Browser GPU script (Windows PowerShell 5.1)
    # src/woa/browser-gpu/rk3576-browser-gpu.ps1, the copy of woa-rk3576's
    # that every Windows install runs: its own tests, a dry run on the
    # runner, and a warning when it differs from woa-rk3576's main
    # (scripts/sync-browser-gpu.mjs brings it over).
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          powershell -NoProfile -ExecutionPolicy Bypass -File src\woa\browser-gpu\browser-gpu.tests.ps1 -Script (Resolve-Path src\woa\browser-gpu\rk3576-browser-gpu.ps1)
          if ($LASTEXITCODE -ne 0) { throw 'browser-gpu.tests.ps1 failed' }
      - name: Status and a dry run on the runner (no RK3576, so the gate says no)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File src\woa\browser-gpu\rk3576-browser-gpu.ps1 -Action Status
          if ($LASTEXITCODE -ne 0) { throw 'Status' }
          powershell -NoProfile -ExecutionPolicy Bypass -File src\woa\browser-gpu\rk3576-browser-gpu.ps1 -Action Install -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'Install -DryRun' }
          if (Get-ScheduledTask -TaskPath '\RK3576\' -ErrorAction SilentlyContinue) { throw 'a dry run registered the task' }
      - name: Same as woa-rk3576 main
        shell: pwsh
        run: |
          foreach ($p in @(@('tools/rk3576-tools/setup/rk3576-browser-gpu.ps1', 'src/woa/browser-gpu/rk3576-browser-gpu.ps1'),
                           @('tools/rk3576-tools/tests/browser-gpu.tests.ps1', 'src/woa/browser-gpu/browser-gpu.tests.ps1'))) {
            try {
              $up = (Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/gahingwoo/woa-rk3576/main/$($p[0])").Content -replace "`r`n", "`n"
            } catch { Write-Host "::warning::could not fetch woa-rk3576 $($p[0]): $($_.Exception.Message)"; continue }
            $here = (Get-Content -Raw $p[1]) -replace "`r`n", "`n"
            if ($up -ne $here) { Write-Host "::warning file=$($p[1])::differs from woa-rk3576 main $($p[0]); run node scripts/sync-browser-gpu.mjs <woa-rk3576 checkout>" }
            else { Write-Host "$($p[1]) is woa-rk3576 main's" }
          }
